<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--col:#dde3ea;--card:#fff;--ink:#17212b;--mute:#5d6b79;--line:#c9d2dc;--accent:#1f6f8b;--hi:#d64545;--mid:#e3a21a;--lo:#3f9b6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--col:#1a232d;--card:#243040;--ink:#e8eef4;--mute:#96a5b4;--line:#32404f;--accent:#5fb4d2}}
:root[data-theme="dark"]{--bg:#10171e;--col:#1a232d;--card:#243040;--ink:#e8eef4;--mute:#96a5b4;--line:#32404f;--accent:#5fb4d2}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Figtree,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 20px}
h1{font:700 24px 'Bricolage Grotesque',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.tools{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea,button{font:inherit;color:inherit}
.search,.f{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px;padding:0 20px 24px;overflow-x:auto}
.col{background:var(--col);border-radius:10px;padding:12px;min-height:240px}
.col.over{outline:2px dashed var(--accent)}
.col h2{font:700 16px 'Bricolage Grotesque',system-ui,sans-serif;margin:0 0 10px;display:flex;justify-content:space-between}
.col h2 span{color:var(--mute);font:500 14px Figtree,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--lo);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.card.media{border-left-color:var(--mid)}.card.alta{border-left-color:var(--hi)}
.card.dragging{opacity:.4}
.card b{display:block;font-weight:600}
.card p{margin:4px 0 0;color:var(--mute);font-size:13px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--mute)}
.meta button{padding:2px 8px;font-size:12px}
.late{color:var(--hi);font-weight:600}
.empty{color:var(--mute);font-size:13px;padding:8px 2px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;margin:10px 0 4px;font-weight:500}
.f{width:100%}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>Tablero</h1>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Buscar tareas" aria-label="Buscar tareas">
    <select class="search" id="pf" aria-label="Filtrar por prioridad"><option value="">Todas las prioridades</option><option>alta</option><option>media</option><option>baja</option></select>
    <button id="theme">Tema</button>
    <button class="primary" id="add">Nueva tarea</button>
  </div>
</header>
<main class="board" id="board"></main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dt" style="margin:0;font:700 18px 'Bricolage Grotesque',sans-serif">Nueva tarea</h2>
    <label for="t">Título</label><input class="f" id="t" required maxlength="80">
    <label for="d">Descripción</label><textarea class="f" id="d" rows="3" maxlength="300"></textarea>
    <label for="p">Prioridad</label><select class="f" id="p"><option>baja</option><option selected>media</option><option>alta</option></select>
    <label for="due">Fecha límite</label><input class="f" id="due" type="date">
    <div class="row"><button type="button" id="cancel">Cancelar</button><button class="primary" value="ok">Guardar tarea</button></div>
  </form>
</dialog>

<script>
const COLS=[["todo","Por hacer"],["doing","En progreso"],["done","Hecho"]];
let tasks=[],editId=null,dragId=null;
const $=s=>document.querySelector(s);
function load(){try{tasks=JSON.parse(localStorage.getItem("tablero")||"null")||[]}catch(e){tasks=[]}
 if(!tasks.length)tasks=[
  {id:1,t:"Diseñar el modelo de datos",d:"Usuarios, tableros, columnas y tareas",p:"alta",due:"",s:"doing"},
  {id:2,t:"Escribir el README",d:"Capturas, stack y cómo ejecutarlo",p:"media",due:"",s:"todo"},
  {id:3,t:"Maquetar el tablero",d:"",p:"baja",due:"",s:"done"}]}
function save(){try{localStorage.setItem("tablero",JSON.stringify(tasks))}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
 const q=$("#q").value.toLowerCase(),pf=$("#pf").value,today=new Date().toISOString().slice(0,10);
 $("#board").innerHTML=COLS.map(([k,name])=>{
  const list=tasks.filter(x=>x.s===k&&(!pf||x.p===pf)&&(x.t+x.d).toLowerCase().includes(q));
  return `<section class="col" data-s="${k}"><h2>${name}<span>${list.length}</span></h2>`+
   (list.map(x=>`<article class="card ${x.p}" draggable="true" data-id="${x.id}"><b>${esc(x.t)}</b>${x.d?`<p>${esc(x.d)}</p>`:""}
   <div class="meta"><span class="${x.due&&x.due<today&&x.s!=="done"?"late":""}">${x.due?"Vence "+x.due:"Sin fecha"} · ${x.p}</span>
   <span><button data-edit="${x.id}">Editar</button> <button data-del="${x.id}" aria-label="Eliminar ${esc(x.t)}">Eliminar</button></span></div></article>`).join("")||'<div class="empty">Arrastra una tarea aquí.</div>')+`</section>`}).join("")}
function openDlg(id){editId=id;const x=tasks.find(t=>t.id===id)||{t:"",d:"",p:"media",due:""};
 $("#dt").textContent=id?"Editar tarea":"Nueva tarea";$("#t").value=x.t;$("#d").value=x.d;$("#p").value=x.p;$("#due").value=x.due;$("#dlg").showModal();$("#t").focus()}
$("#add").onclick=()=>openDlg(null);
$("#cancel").onclick=()=>$("#dlg").close();
$("#form").onsubmit=e=>{const v={t:$("#t").value.trim(),d:$("#d").value.trim(),p:$("#p").value,due:$("#due").value};
 if(!v.t)return;
 if(editId)Object.assign(tasks.find(t=>t.id===editId),v);else tasks.push({id:Date.now(),s:"todo",...v});
 save();render()};
$("#board").addEventListener("click",e=>{const ed=e.target.dataset.edit,del=e.target.dataset.del;
 if(ed)openDlg(+ed);
 if(del&&confirm("¿Eliminar esta tarea?")){tasks=tasks.filter(t=>t.id!==+del);save();render()}});
$("#board").addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(!c)return;dragId=+c.dataset.id;c.classList.add("dragging");e.dataTransfer.effectAllowed="move"});
$("#board").addEventListener("dragend",()=>{dragId=null;render()});
$("#board").addEventListener("dragover",e=>{const c=e.target.closest(".col");if(c){e.preventDefault();document.querySelectorAll(".col").forEach(x=>x.classList.toggle("over",x===c))}});
$("#board").addEventListener("drop",e=>{e.preventDefault();const c=e.target.closest(".col");if(!c||!dragId)return;
 const t=tasks.find(x=>x.id===dragId);t.s=c.dataset.s;save();render()});
$("#q").oninput=render;$("#pf").onchange=render;
$("#theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
load();render();
</script>
</body>
</html>
