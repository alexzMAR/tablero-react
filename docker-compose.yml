services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tablero
      POSTGRES_PASSWORD: tablero
      POSTGRES_DB: tablero
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql
volumes:
  pgdata: